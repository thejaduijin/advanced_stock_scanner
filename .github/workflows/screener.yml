name: Run Mehta Screener

on:
  schedule:
    # 4:00 PM IST = 10:30 UTC, Monday-Friday only
    - cron: '30 10 * * 1-5'
    # Optional: 9:30 AM IST pre-market run = 4:00 UTC
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ADVANCED screener
        run: python mehta_screener_advanced.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Convert Excel to JSON
        run: python scripts/excel_to_json.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: EOD screener update $(date +%F_%H-%M)"
          git push